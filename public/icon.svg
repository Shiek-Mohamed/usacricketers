<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="64" fill="#1e2a5e"/>
  <!-- Cricket ball -->
  <circle cx="256" cy="256" r="140" fill="#b91c1c"/>
  <!-- Ball seam -->
  <path d="M 130 200 Q 256 160 382 200" stroke="#ffffff" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M 130 220 Q 256 180 382 220" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="8 6"/>
  <path d="M 130 240 Q 256 200 382 240" stroke="#ffffff" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- Highlight -->
  <ellipse cx="210" cy="190" rx="30" ry="20" fill="#dc2626" opacity="0.6"/>
  <!-- USA text -->
  <text x="256" y="420" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="#f59e0b" text-anchor="middle">USA</text>
  <text x="256" y="470" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle" opacity="0.8">CRICKETERS</text>
</svg>
