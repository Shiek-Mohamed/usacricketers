# Fly.io config for usacricketers CMS
# Deploy: flyctl deploy
# App URL: https://usacricketers.fly.dev (or custom domain later)

app = "usacricketers"
primary_region = "iad"  # US East (Washington D.C.) — closest to most US cricket leagues

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  NODE_ENV = "production"
  CADDY_PORT = "8080"
  NEXT_TELEMETRY_DISABLED = "1"

# Next.js (port 3000) is the front-facing server. The Dockerfile's
# start-all.sh starts Next.js on 3000 + score-service on 3003.
# NOTE: score-service (socket.io, port 3003) is reachable inside the
# container but not via the public URL without a Caddy gateway. If live
# scoring via the public URL is needed later, add Caddy on 8080 that
# routes ?XTransformPort=3003 → localhost:3003 and everything else → 3000.
[[services]]
  internal_port = "3000"
  protocol = "tcp"

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true  # auto-redirect HTTP → HTTPS

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "90s"

# 2GB RAM — Next.js standalone + score-service + Prisma + Caddy overhead.
# 1GB was too tight (OOM kernel reboots every ~9 min). 2GB gives headroom.
[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 1

# Persistent volume for SQLite database
# Survives restarts + deploys. Mounted at /app/db (where DATABASE_URL points).
[[mounts]]
  source = "usacricketers_data"
  destination = "/app/db"
  initial_size = "1gb"
